<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Data centre mechanical and electrical infrastructure</title>
<desc id="desc">A stylized wide illustration of a mission-critical data centre plant room with ducts, pipework, pumps, switchgear and engineers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dce5ec"/><stop offset="1" stop-color="#f4f6f8"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8fafb"/><stop offset="1" stop-color="#dce3e8"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a9b8c4"/><stop offset=".45" stop-color="#eef3f6"/><stop offset="1" stop-color="#8fa2b1"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#243746" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="1600" height="700" fill="url(#bg)"/>
<polygon points="0,470 1600,405 1600,700 0,700" fill="url(#floor)"/>

<!-- ceiling structure -->
<g opacity=".92" stroke="#667988" stroke-width="7" fill="none">
  <path d="M0 85 H1600"/><path d="M0 150 H1600"/>
  <path d="M110 0 V220 M410 0 V210 M760 0 V205 M1120 0 V200 M1450 0 V195"/>
</g>
<g fill="#f9fbfc" stroke="#aebdc8" stroke-width="4">
  <rect x="70" y="34" width="470" height="38" rx="8"/>
  <rect x="620" y="36" width="430" height="36" rx="8"/>
  <rect x="1120" y="38" width="360" height="34" rx="8"/>
</g>

<!-- overhead cable trays -->
<g fill="none" stroke-linecap="round">
  <path d="M100 120 H1500" stroke="#c99319" stroke-width="16"/>
  <path d="M100 120 H1500" stroke="#f4c54a" stroke-width="7"/>
  <path d="M250 178 H1520" stroke="#526979" stroke-width="22"/>
  <path d="M250 178 H1520" stroke="#b6c4ce" stroke-width="7" stroke-dasharray="26 18"/>
</g>

<!-- large ductwork -->
<g fill="url(#metal)" stroke="#7c909f" stroke-width="5">
  <path d="M0 205 H290 V315 H365 V185 H620 V250 H720 V165 H1030 V230 H1600 V295 H980 V235 H790 V320 H555 V255 H425 V390 H250 V275 H0 Z"/>
  <rect x="75" y="190" width="95" height="355" rx="12"/>
  <rect x="184" y="245" width="70" height="300" rx="10"/>
</g>
<g stroke="#687d8c" stroke-width="3" opacity=".65">
  <path d="M95 190 V545 M135 190 V545 M205 245 V545 M230 245 V545"/>
</g>

<!-- back wall / corridor -->
<g>
  <rect x="1110" y="250" width="490" height="200" fill="#eef2f4"/>
  <path d="M1110 450 H1600" stroke="#b8c4cc" stroke-width="5"/>
  <path d="M1210 250 V450 M1360 250 V450 M1510 250 V450" stroke="#d6dde2" stroke-width="4"/>
</g>

<!-- switchgear -->
<g filter="url(#shadow)">
  <g fill="#f7f8f9" stroke="#899aa7" stroke-width="4">
    <rect x="965" y="315" width="135" height="265" rx="5"/>
    <rect x="1110" y="330" width="115" height="245" rx="5"/>
    <rect x="1238" y="342" width="105" height="225" rx="5"/>
  </g>
  <g fill="#293f50">
    <rect x="1005" y="350" width="50" height="12" rx="3"/>
    <rect x="1142" y="365" width="45" height="11" rx="3"/>
    <rect x="1268" y="375" width="40" height="10" rx="3"/>
  </g>
  <g fill="#e9b12c">
    <rect x="965" y="315" width="10" height="265"/>
    <rect x="1090" y="315" width="10" height="265"/>
  </g>
</g>

<!-- pumps / motors -->
<g filter="url(#shadow)">
  <rect x="360" y="500" width="520" height="38" rx="8" fill="#708391"/>
  <g>
    <rect x="430" y="425" width="175" height="82" rx="18" fill="#8ea2b0" stroke="#526979" stroke-width="5"/>
    <circle cx="460" cy="466" r="38" fill="#607886" stroke="#344b5b" stroke-width="6"/>
    <circle cx="460" cy="466" r="16" fill="#dfe6ea"/>
    <rect x="600" y="442" width="95" height="50" rx="12" fill="#476777"/>
  </g>
  <g transform="translate(250 5)">
    <rect x="430" y="425" width="175" height="82" rx="18" fill="#8ea2b0" stroke="#526979" stroke-width="5"/>
    <circle cx="460" cy="466" r="38" fill="#607886" stroke="#344b5b" stroke-width="6"/>
    <circle cx="460" cy="466" r="16" fill="#dfe6ea"/>
    <rect x="600" y="442" width="95" height="50" rx="12" fill="#476777"/>
  </g>
</g>

<!-- pipework -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M325 500 V390 Q325 360 355 360 H520 Q550 360 550 330 V265" stroke="#c8d2d9" stroke-width="31"/>
  <path d="M325 500 V390 Q325 360 355 360 H520 Q550 360 550 330 V265" stroke="#f4f7f8" stroke-width="19"/>
  <path d="M700 430 V360 Q700 330 730 330 H850 Q880 330 880 300 V245" stroke="#91a6b4" stroke-width="26"/>
  <path d="M700 430 V360 Q700 330 730 330 H850 Q880 330 880 300 V245" stroke="#dfe7eb" stroke-width="15"/>
  <path d="M320 385 H940" stroke="#cc3d35" stroke-width="10"/>
  <path d="M350 405 H910" stroke="#2f77a8" stroke-width="10"/>
</g>

<!-- floor perspective -->
<g stroke="#c4ced5" stroke-width="3" opacity=".72">
  <path d="M0 560 H1600 M0 630 H1600"/>
  <path d="M170 465 L80 700 M420 452 L390 700 M720 440 L735 700 M1010 430 L1090 700 M1300 418 L1460 700"/>
</g>

<!-- engineers -->
<g transform="translate(1390 395)" filter="url(#shadow)">
  <circle cx="0" cy="0" r="16" fill="#f1c6a8"/>
  <path d="M-18 -8 Q0 -30 20 -8 L15 -2 H-15 Z" fill="#f7f8f9" stroke="#708391" stroke-width="3"/>
  <path d="M-18 20 Q0 8 18 20 L26 92 H-26 Z" fill="#1d65a6"/>
  <rect x="-27" y="48" width="54" height="8" fill="#f0c33b"/>
  <path d="M-18 92 L-24 145 M18 92 L25 145" stroke="#223847" stroke-width="14" stroke-linecap="round"/>
</g>
<g transform="translate(1500 375) scale(.86)" filter="url(#shadow)">
  <circle cx="0" cy="0" r="16" fill="#d6a985"/>
  <path d="M-18 -8 Q0 -30 20 -8 L15 -2 H-15 Z" fill="#f7f8f9" stroke="#708391" stroke-width="3"/>
  <path d="M-18 20 Q0 8 18 20 L26 92 H-26 Z" fill="#1d65a6"/>
  <rect x="-27" y="48" width="54" height="8" fill="#f0c33b"/>
  <path d="M-18 92 L-24 145 M18 92 L25 145" stroke="#223847" stroke-width="14" stroke-linecap="round"/>
</g>

<!-- subtle depth -->
<rect width="1600" height="700" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
</svg>